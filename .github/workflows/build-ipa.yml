name: Build IPA

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:          # lets you trigger manually from the Actions tab

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Select Xcode 26 ─────────────────────────────────────────────────
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Show Xcode & SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      # ── 3. Resolve Swift packages (if any) ─────────────────────────────────
      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project WalletAI.xcodeproj \
            -scheme WalletAI \
            -clonedSourcePackagesDirPath .spm-cache
        continue-on-error: true   # no SPM deps in this project, safe to skip

      # ── 4. Build & Archive (no code signing) ───────────────────────────────
      - name: Build archive
        run: |
          xcodebuild archive \
            -project WalletAI.xcodeproj \
            -scheme WalletAI \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/WalletAI.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO \
            SKIP_INSTALL=NO \
            | xcbeautify --quiet || \
          xcodebuild archive \
            -project WalletAI.xcodeproj \
            -scheme WalletAI \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/WalletAI.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO \
            SKIP_INSTALL=NO

      # ── 5. Package .app → .ipa ─────────────────────────────────────────────
      - name: Package IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/WalletAI.xcarchive/Products" -name "*.app" | head -1)
          echo "Found app at: $APP_PATH"

          mkdir -p "$RUNNER_TEMP/IPA/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/IPA/Payload/"

          cd "$RUNNER_TEMP/IPA"
          zip -r "$RUNNER_TEMP/WalletAI.ipa" Payload

          echo "IPA size: $(du -sh "$RUNNER_TEMP/WalletAI.ipa" | cut -f1)"

      # ── 6. Upload IPA as artifact ──────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WalletAI-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/WalletAI.ipa
          retention-days: 30
          if-no-files-found: error

      # ── 7. Upload dSYMs (useful for crash symbolication) ──────────────────
      - name: Upload dSYMs artifact
        uses: actions/upload-artifact@v4
        with:
          name: WalletAI-dSYMs-${{ github.sha }}
          path: ${{ runner.temp }}/WalletAI.xcarchive/dSYMs
          retention-days: 30
          if-no-files-found: warn

      # ── 8. Summary ────────────────────────────────────────────────────────
      - name: Write job summary
        run: |
          echo "## WalletAI Build Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Xcode | 26.3 |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS Target | 26.0 |" >> $GITHUB_STEP_SUMMARY
          echo "| IPA | unsigned (ready for Sideloadly / AltStore) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### How to install" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the \`WalletAI-unsigned-*\` artifact from the **Artifacts** section below" >> $GITHUB_STEP_SUMMARY
          echo "2. Unzip it — you'll get \`WalletAI.ipa\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Open **Sideloadly** (Windows/Mac) → drag the IPA → sign with your Apple ID → install" >> $GITHUB_STEP_SUMMARY
          echo "4. Or use **AltStore** on your PC → My Apps → + → choose the IPA" >> $GITHUB_STEP_SUMMARY
