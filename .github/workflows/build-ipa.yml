name: Build IPA

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Select Xcode 26 ─────────────────────────────────────────────────
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Show Xcode & SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      # ── 3. Wire up the app icon ────────────────────────────────────────────
      # WalletAI.png lives at the repo root; copy it into the asset catalog.
      - name: Add app icon
        run: |
          ICONSET="WalletAI/Resources/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          if [ -f "WalletAI.png" ]; then
            cp WalletAI.png "$ICONSET/AppIcon-1024.png"
            echo "Icon copied ✓"
          else
            echo "WalletAI.png not found — build will use default icon"
          fi

      # ── 4. Build for real device (unsigned) ────────────────────────────────
      # Key flags:
      #   -sdk iphoneos          → target real device, not simulator
      #   ONLY_ACTIVE_ARCH=NO    → compile arm64 even on an x86 runner
      #   CODE_SIGNING_*         → skip all signing; Sideloadly will sign it
      #   SKIP_INSTALL=NO        → include the .app in build output
      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project WalletAI.xcodeproj \
            -scheme WalletAI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SKIP_INSTALL=NO \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      # ── 5. Locate the .app bundle ──────────────────────────────────────────
      - name: Locate .app bundle
        id: locate
        run: |
          BUILD_DIR="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos"
          echo "Contents of Release-iphoneos:"
          ls -la "$BUILD_DIR" 2>/dev/null || echo "(directory missing)"

          APP=$(find "$BUILD_DIR" -maxdepth 1 -name "*.app" | head -1)

          # Wide fallback
          if [ -z "$APP" ]; then
            echo "Primary path empty — running wide search…"
            find "$RUNNER_TEMP/DerivedData" -name "*.app" \
              -not -path "*/SourcePackages/*" \
              -not -name "*Tests*" 2>/dev/null
            APP=$(find "$RUNNER_TEMP/DerivedData" -name "WalletAI.app" \
              -not -path "*/SourcePackages/*" | head -1)
          fi

          if [ -z "$APP" ]; then
            echo "ERROR: WalletAI.app not found. Full DerivedData layout:"
            find "$RUNNER_TEMP/DerivedData" -maxdepth 7 | head -100
            exit 1
          fi

          echo "APP_PATH=$APP" >> "$GITHUB_OUTPUT"
          echo "Found: $APP"
          echo "Bundle size: $(du -sh "$APP" | cut -f1)"

      # ── 6. Package .app → .ipa ─────────────────────────────────────────────
      - name: Package IPA
        run: |
          APP="${{ steps.locate.outputs.APP_PATH }}"
          PAYLOAD="$RUNNER_TEMP/Payload"

          mkdir -p "$PAYLOAD"
          cp -r "$APP" "$PAYLOAD/"

          cd "$RUNNER_TEMP"
          zip -r "WalletAI.ipa" Payload

          SIZE=$(du -sh "WalletAI.ipa" | cut -f1)
          echo "IPA size: $SIZE"

          # Sanity check — a real IPA is at least a few MB
          BYTES=$(stat -f%z "WalletAI.ipa" 2>/dev/null || stat -c%s "WalletAI.ipa")
          if [ "$BYTES" -lt 100000 ]; then
            echo "ERROR: IPA is suspiciously small ($BYTES bytes). Packaging likely failed."
            exit 1
          fi

      # ── 7. Upload IPA artifact ─────────────────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WalletAI-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/WalletAI.ipa
          retention-days: 30
          if-no-files-found: error

      # ── 8. Upload build log on failure ─────────────────────────────────────
      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: ${{ runner.temp }}/build.log
          retention-days: 7
          if-no-files-found: ignore

      # ── 9. Job summary ─────────────────────────────────────────────────────
      - name: Write job summary
        if: success()
        run: |
          BYTES=$(stat -f%z "$RUNNER_TEMP/WalletAI.ipa" 2>/dev/null || stat -c%s "$RUNNER_TEMP/WalletAI.ipa")
          MB=$(echo "scale=1; $BYTES/1048576" | bc)
          echo "## WalletAI Build ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Xcode | 26.3 |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS Target | 26.0 |" >> $GITHUB_STEP_SUMMARY
          echo "| IPA size | ${MB} MB |" >> $GITHUB_STEP_SUMMARY
          echo "| Signing | unsigned — ready for Sideloadly / AltStore |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### How to install" >> $GITHUB_STEP_SUMMARY
          echo "1. Download **WalletAI-unsigned** from Artifacts below" >> $GITHUB_STEP_SUMMARY
          echo "2. Unzip → get \`WalletAI.ipa\`" >> $GITHUB_STEP_SUMMARY
          echo "3. **[Sideloadly](https://sideloadly.io)** (Windows/Mac) → drag IPA → Apple ID → Start" >> $GITHUB_STEP_SUMMARY
          echo "4. Or **[AltStore](https://altstore.io)** → My Apps → + → pick IPA" >> $GITHUB_STEP_SUMMARY
