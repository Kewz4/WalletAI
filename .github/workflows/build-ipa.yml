name: Build IPA

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Select Xcode 26 ─────────────────────────────────────────────────
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Show Xcode & SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      # ── 3. Build for device (no archive, no signing) ───────────────────────
      # We use `build` instead of `archive` so the .app lands in a predictable
      # location under SYMROOT regardless of signing configuration.
      - name: Build app
        run: |
          xcodebuild build \
            -project WalletAI.xcodeproj \
            -scheme WalletAI \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SKIP_INSTALL=NO \
            | tee "$RUNNER_TEMP/build.log" | xcpretty || \
          xcodebuild build \
            -project WalletAI.xcodeproj \
            -scheme WalletAI \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SKIP_INSTALL=NO

      # ── 4. Debug: show what was built ──────────────────────────────────────
      - name: Locate .app bundle
        id: locate_app
        run: |
          echo "=== DerivedData tree (*.app only) ==="
          find "$RUNNER_TEMP/DerivedData" -name "*.app" -not -path "*/SourcePackages/*" 2>/dev/null || true

          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products" \
            -name "*.app" \
            -not -name "*Tests*" \
            -not -path "*/SourcePackages/*" \
            | head -1)

          if [ -z "$APP_PATH" ]; then
            # Wider fallback search
            APP_PATH=$(find "$RUNNER_TEMP/DerivedData" \
              -name "WalletAI.app" \
              -not -path "*/SourcePackages/*" \
              | head -1)
          fi

          echo "APP_PATH=$APP_PATH" >> $GITHUB_OUTPUT
          echo "Found: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found. Dumping full DerivedData layout:"
            find "$RUNNER_TEMP/DerivedData" -maxdepth 6 | head -80
            exit 1
          fi

      # ── 5. Package .app → .ipa ─────────────────────────────────────────────
      - name: Package IPA
        run: |
          APP_PATH="${{ steps.locate_app.outputs.APP_PATH }}"
          echo "Packaging: $APP_PATH"

          mkdir -p "$RUNNER_TEMP/IPA/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/IPA/Payload/"

          cd "$RUNNER_TEMP/IPA"
          zip -r "$RUNNER_TEMP/WalletAI.ipa" Payload

          echo "IPA size: $(du -sh "$RUNNER_TEMP/WalletAI.ipa" | cut -f1)"

      # ── 6. Upload IPA artifact ─────────────────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WalletAI-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/WalletAI.ipa
          retention-days: 30
          if-no-files-found: error

      # ── 7. Upload build log on failure ─────────────────────────────────────
      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: ${{ runner.temp }}/build.log
          retention-days: 7
          if-no-files-found: ignore

      # ── 8. Job summary ─────────────────────────────────────────────────────
      - name: Write job summary
        if: success()
        run: |
          echo "## WalletAI Build ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Xcode | 26.3 |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS Target | 26.0 |" >> $GITHUB_STEP_SUMMARY
          echo "| Signing | unsigned — ready for Sideloadly / AltStore |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Install steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Download **WalletAI-unsigned-\`${{ github.sha }}\`** from Artifacts below" >> $GITHUB_STEP_SUMMARY
          echo "2. Unzip → get \`WalletAI.ipa\`" >> $GITHUB_STEP_SUMMARY
          echo "3. **Sideloadly** (Windows/Mac) → drag IPA → sign with Apple ID → Start" >> $GITHUB_STEP_SUMMARY
          echo "4. Or **AltStore** → My Apps → + → pick IPA" >> $GITHUB_STEP_SUMMARY
